# ResNet-50 (25 M), ImageNet-1k supervised (timm A1 recipe). The classic baseline.
name: resnet50_in1k
backbone: resnet50.a1_in1k
embedding_dim: 512
arcface_scale: 30.0
arcface_margin: 0.3
lr_backbone: 2.0e-04
layer_decay: 1.0       # layer-wise decay is implemented for ViT blocks only (1.0 = off)
lr_head: 1.0e-3
weight_decay: 0.05
warmup_epochs: 1
