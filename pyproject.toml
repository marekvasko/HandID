[project]
name = "handid"
version = "0.1.0"
description = "Person identification from the dorsal side of the hand (PyTorch Lightning + Hydra + MLflow)"
authors = [
    { name = "Marek Vaško", email = "ivasko@fit.vutbr.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.8",
    "kornia>=0.9.2",
    "libarchive-c>=5.3",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.3",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.31",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true   # only torch/torchvision come from here

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
